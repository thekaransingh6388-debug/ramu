<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikka777 – India's fastest growing app</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Meta Pixel Code (UPDATED with new pixel ID) -->

    n.queue=[];t=b.createElement(e);t.async=!0;

    src="https://www.facebook.com/tr?id=2097959614159367&ev=PageView&noscript=1"

    <style>
        /* ---- NEW COLOUR PALETTE (warm cream, deep maroon, soft coral) ---- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(145deg, #fff5f0 0%, #ffe8e0 40%, #ffded6 100%);
            min-height: 100vh;
        }

        /* CTA button – richer, deeper red with subtle rose gold shimmer */
        .glow-button {
            background: linear-gradient(135deg, #b81c2b 0%, #8b0f1c 80%);
            box-shadow: 0 12px 28px -6px rgba(184, 28, 43, 0.5), 0 4px 12px -2px rgba(120, 10, 20, 0.3);
            transition: all 0.3s ease;
        }

        .glow-button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #d42234 0%, #a11322 80%);
            box-shadow: 0 16px 32px -6px rgba(184, 28, 43, 0.7), 0 6px 16px -2px rgba(120, 10, 20, 0.45);
        }

        .glow-button:active {
            transform: translateY(1px);
            box-shadow: 0 6px 16px -4px rgba(184, 28, 43, 0.6);
        }

        /* Card / feature style – light ivory with coral border */
        .feature-card {
            background-color: #fffaf8;
            border: 1.5px solid #fbc4b6;
            box-shadow: 0 10px 22px -8px rgba(200, 120, 100, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .feature-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 28px -8px rgba(180, 90, 70, 0.35);
        }

        /* Modal backdrop – deep warm brown overlay */
        .modal-backdrop {
            background-color: rgba(70, 30, 25, 0.7);
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
        }

        .modal-card {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .modal-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-hidden .modal-card {
            transform: scale(0.95) translateY(10px);
        }

        .modal-visible {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-visible .modal-card {
            transform: scale(1) translateY(0);
        }

        /* Custom scrollbar for modal – warmer tones */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #ffe8e0;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e59b8b;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #b81c2b;
        }

        /* small accent for the footer credit */
        .agency-credit {
            letter-spacing: 0.3px;
            font-weight: 600;
            color: #9b4a4a;
            background: rgba(255, 235, 225, 0.7);
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            display: inline-block;
            backdrop-filter: blur(2px);
            font-size: 0.65rem;
            border: 0.5px solid #f3bcae;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen px-4 pt-10 pb-6 antialiased selection:bg-rose-200">

    <!-- Main Content Wrapper -->
    <main class="w-full max-w-md mx-auto text-center flex flex-col items-center justify-center my-auto">

        <!-- Main Title – deeper maroon, slightly more elegant -->
        <h1 class="text-3xl md:text-4xl font-black text-[#6f1e2b] tracking-tight mb-2 drop-shadow-sm">
            Sikka777
        </h1>

        <!-- Subtitle Paragraphs – warmer brown/rose tones -->
        <div class="space-y-1 mb-7 text-[#592f2b] px-2">
            <p class="text-sm md:text-base font-semibold">
                Download the official <span class="font-extrabold text-[#6f1e2b]">Sikka777</span>
            </p>
            <p class="text-xs md:text-sm font-medium leading-relaxed text-[#7c4a40]">
                India's Most Fastest Growing App and smooth experience.
            </p>
        </div>

        <!-- Download CTA Button with APK Link – unchanged structure, new colour via .glow-button -->
        <a href="sikka777.apk" download="sikka777.apk" class="w-full max-w-xs mb-8 block">
            <button type="button" class="w-full py-3.5 px-6 rounded-full text-white font-extrabold text-base tracking-wider glow-button flex items-center justify-center gap-2.5">
                <!-- Down Arrow Icon -->
                <svg class="w-5 h-5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 21V3"></path>
                </svg>
                <span>DOWNLOAD NOW</span>
            </button>
        </a>

        <!-- (Optional empty div from original – kept for structural consistency) -->
        <div class="hidden"></div>
    </main>

    <!-- Footer Section – updated with agency credit and adjusted colours -->
    <footer class="w-full max-w-md mx-auto pt-8 pb-2 text-center">
        <!-- Legal links – warmer and slightly deeper -->
        <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-xs font-semibold text-[#8f5146]">
            <button onclick="openModal('terms')" class="hover:text-[#b81c2b] transition-colors underline decoration-dotted underline-offset-4 focus:outline-none">
                Terms & Conditions
            </button>
            <span class="text-[#d9a89b]">•</span>
            <button onclick="openModal('about')" class="hover:text-[#b81c2b] transition-colors underline decoration-dotted underline-offset-4 focus:outline-none">
                About Us
            </button>
            <span class="text-[#d9a89b]">•</span>
            <button onclick="openModal('disclaimer')" class="hover:text-[#b81c2b] transition-colors underline decoration-dotted underline-offset-4 focus:outline-none">
                Disclaimer
            </button>
            <span class="text-[#d9a89b]">•</span>
            <button onclick="openModal('contact')" class="hover:text-[#b81c2b] transition-colors underline decoration-dotted underline-offset-4 focus:outline-none">
                Contact Us
            </button>
        </div>

        <!-- Ad Manage by Karan Agency – clearly visible, styled -->
        <div class="mt-4 flex justify-center">
            <span class="agency-credit text-xs tracking-wide">
                ⚡ Ad Manage by Karan Agency
            </span>
        </div>

        <!-- Copyright line – warmer grey/rose -->
        <p class="text-[11px] font-medium text-[#a86f63] mt-3">
            © <span id="year"></span> Sikka777. All rights reserved.
        </p>
    </footer>

    <!-- Modal Dialog Overlay Container (unchanged structure, colours adapt via CSS) -->
    <div id="modalContainer" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop modal-hidden" aria-hidden="true">
        <!-- Modal Card -->
        <div class="modal-card bg-[#fffaf7] rounded-3xl shadow-2xl border border-[#fbc4b6] w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden relative" onclick="event.stopPropagation()">
            
            <!-- Modal Header – soft peach gradient -->
            <div class="flex items-center justify-between px-6 py-4 bg-gradient-to-r from-[#fff1ea] to-[#ffe5dc] border-b border-[#fbc4b6]">
                <h2 id="modalTitle" class="text-lg font-bold text-[#6f1e2b] flex items-center gap-2">
                    <!-- Title dynamically inserted -->
                </h2>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/80 hover:bg-[#b81c2b] hover:text-white text-[#6f1e2b] border border-[#f3bcae] flex items-center justify-center transition-all focus:outline-none shadow-sm" aria-label="Close modal">
                    ✕
                </button>
            </div>

            <!-- Modal Content Body -->
            <div id="modalBody" class="p-6 overflow-y-auto custom-scrollbar text-sm text-[#592f2b] leading-relaxed space-y-4">
                <!-- Content dynamically inserted -->
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-3 bg-[#fff5f0] border-t border-[#fbc4b6] flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 rounded-full bg-[#8b0f1c] hover:bg-[#b81c2b] text-white font-semibold text-xs transition-colors shadow">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        // Set dynamic copyright year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Content repository for modals (text only, colours inherited from parent)
        const modalData = {
            'terms': {
                title: '📜 Terms & Conditions',
                content: `
                    <p class="font-semibold text-[#6f1e2b]">Welcome to Sikka777 App!</p>
                    <p>By downloading or using the Sikka777 application, these terms will automatically apply to you. You should make sure that you read them carefully before using the app.</p>
                    <p><strong>1. Usage License:</strong> Permission is granted to download one copy of the Sikka777 App for personal, non-commercial viewing or usage on your mobile device only.</p>
                    <p><strong>2. User Responsibility:</strong> Users must ensure they are using the app in compliance with all local laws and regulations. You are solely responsible for keeping your device secure.</p>
                    <p><strong>3. Updates & Changes:</strong> We reserve the right to modify or update the app features, functionality, or terms at any time without prior notice.</p>
                `
            },
            'about': {
                title: 'ℹ️ About Us',
                content: `
                    <p class="font-semibold text-[#6f1e2b]">About Sikka777 App</p>
                    <p>Sikka777 App is India's fastest-growing platform dedicated to delivering superfast updates and a seamless mobile application experience.</p>
                    <p><strong>Our Mission:</strong> To provide a lightweight, safe, and lightning-fast interface for users across India with zero latency and hassle-free updates.</p>
                    <p><strong>Why Choose Us?</strong></p>
                    <ul class="list-disc pl-5 space-y-1">
                        <li>Instant real-time result updates without delays.</li>
                        <li>High-security data protection standards.</li>
                        <li>Optimized for low-end to high-end Android phones.</li>
                    </ul>
                `
            },
            'disclaimer': {
                title: '⚠️ Disclaimer',
                content: `
                    <p class="font-semibold text-[#6f1e2b]">Important Notice</p>
                    <p>The information and result updates provided on the Sikka777 App are strictly for informational and educational purposes.</p>
                    <p>Sikka777 App does not promote or encourage illegal activities. Users are advised to exercise discretion and ensure full compliance with their local legal guidelines.</p>
                    <p>We do not guarantee 100% uninterrupted service, though we strive to deliver maximum uptime and accurate information at all times.</p>
                `
            },
            'contact': {
                title: '📞 Contact Us',
                content: `
                    <p class="font-semibold text-[#6f1e2b]">Get in Touch</p>
                    <p>Have questions, feedback, or need help with Sikka777 App? Our support team is here to assist you!</p>
                    <div class="bg-[#ffe8e0] p-3.5 rounded-xl border border-[#fbc4b6] space-y-2 text-xs my-2">
                        <p class="flex items-center gap-2"><strong>📧 Email:</strong> support@sikka777app.com</p>
                        <p class="flex items-center gap-2"><strong>⏱️ Hours:</strong> Monday - Saturday (9 AM - 8 PM)</p>
                        <p class="flex items-center gap-2"><strong>📍 Location:</strong> India</p>
                    </div>
                    <p class="text-xs text-[#8f5146]">We usually respond to all inquiries within 24 hours.</p>
                `
            }
        };

        const modalContainer = document.getElementById('modalContainer');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        function openModal(key) {
            const data = modalData[key];
            if (!data) return;
            modalTitle.innerHTML = data.title;
            modalBody.innerHTML = data.content;
            modalContainer.classList.remove('modal-hidden');
            modalContainer.classList.add('modal-visible');
            modalContainer.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalContainer.classList.remove('modal-visible');
            modalContainer.classList.add('modal-hidden');
            modalContainer.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        modalContainer.addEventListener('click', function(e) {
            if (e.target === modalContainer) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modalContainer.classList.contains('modal-visible')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
